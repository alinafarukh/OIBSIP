<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: rgb(14, 14, 110);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.papa {
    margin: 7px;
    padding: 23px;
    text-align: center;
    font-size: 2rem;
    font-weight: bolder;
    background-color: rgb(33, 33, 207);
    color: white;
}

main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px 15px;
}

.container {
    background-color: white;
    width: 90%;
    max-width: 400px;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
}

.container h1 {
    text-align: center;
    color: #333;
    margin-bottom: 10px;
    font-size: 26px;
}

.container p {
    text-align: center;
    color: #666;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 12px 0 6px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background-color: #536dfe;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    background-color: #304ffe;
}

h2 {
    margin-top: 20px;
    text-align: center;
    color: #333;
    font-size: 18px;
    overflow-wrap: anywhere;
}

.bottom-bar {
    background: rgb(33, 33, 207);
    text-align: center;
    padding: 17px 10px;
}

.bottom-bar p {
    color: white;
    margin: 0;
    font-size: 16px;
}

@media (max-width: 480px) {
    .papa {
        font-size: 1.5rem;
        padding: 18px 10px;
    }

    .container {
        padding: 22px;
    }
}
    </style>
</head>
<body>

    <header>
        <h1 class="papa">A Mini Temperature Converter</h1>
    </header>

    <main>
        <div class="container">
            <h1>Temperature Converter</h1>
            <p>Convert temperature easily</p>

            <label for="temperature">Enter Temperature:</label>
            <input type="number" id="temperature"
                   placeholder="Enter value" step="any">

            <label for="fromUnit">From:</label>
            <select id="fromUnit">
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
            </select>

            <label for="toUnit">To:</label>
            <select id="toUnit">
                <option value="F">Fahrenheit (°F)</option>
                <option value="C">Celsius (°C)</option>
                <option value="K">Kelvin (K)</option>
            </select>

            <button onclick="convertTemperature()">Convert</button>

            <h2 id="result" aria-live="polite">
                Result will appear here
            </h2>
        </div>
    </main>

    <footer>
        <div class="bottom-bar">
            <p>&copy; 2026 A Temperature Converter Website</p>
        </div>
    </footer>

    <script>

        function convertTemperature() {
    let temperature = parseFloat(
        document.getElementById("temperature").value
    );

    let fromUnit = document.getElementById("fromUnit").value;
    let toUnit = document.getElementById("toUnit").value;
    let result;

    if (
        document.getElementById("temperature").value.trim() === "" ||
        !Number.isFinite(temperature)
    ) {
        document.getElementById("result").innerText =
            "Please enter a valid temperature.";
        return;
    }

    if (fromUnit === "K" && temperature < 0) {
        document.getElementById("result").innerText =
            "Kelvin cannot be negative.";
        return;
    }

    if (fromUnit === "C" && temperature < -273.15) {
        document.getElementById("result").innerText =
            "Temperature cannot be below absolute zero.";
        return;
    }

    if (fromUnit === "F" && temperature < -459.67) {
        document.getElementById("result").innerText =
            "Temperature cannot be below absolute zero.";
        return;
    }

    // Convert the input to Celsius first
    let celsius;

    if (fromUnit === "C") {
        celsius = temperature;
    } else if (fromUnit === "F") {
        celsius = (temperature - 32) * 5 / 9;
    } else {
        celsius = temperature - 273.15;
    }

    // Convert Celsius to the selected unit
    if (toUnit === "C") {
        result = celsius;
    } else if (toUnit === "F") {
        result = (celsius * 9 / 5) + 32;
    } else {
        result = celsius + 273.15;
    }

    document.getElementById("result").innerText =
        "Result: " + result.toFixed(2) + " " + toUnit;
}
    </script>
</body>
</html>
